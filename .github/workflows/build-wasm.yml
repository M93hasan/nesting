name: Build WASM packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/wasm/Cargo.toml'
      - 'web/wasm/Cargo.lock'
      - 'web/wasm/rust-toolchain.toml'
      - 'web/wasm/src/**'
      - 'web/wasm/examples/**'
      - 'web/scripts/build-wasm.mjs'
      - 'web/scripts/rayon-helpers.js'
      - 'web/scripts/wasm-fingerprint.mjs'
      - '.github/workflows/build-wasm.yml'

permissions:
  contents: write

concurrency:
  group: wasm-prebuild-main
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-30
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/wasm
      - run: npm install --global wasm-pack@0.15.0
      - run: npm run wasm:build
      - name: Record WASM source fingerprint
        run: node scripts/wasm-fingerprint.mjs > wasm/prebuilt.sha256
      - name: Commit prebuilt WASM packages
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/wasm/pkg web/wasm/pkg-threads web/wasm/pkg-nosimd web/wasm/pkg-threads-nosimd
          # Cargo may refresh the lockfile when Sparrow/Jagua revisions change.
          # Commit it together with the binaries and fingerprint; otherwise the
          # next checkout hashes a different lockfile and reports stale WASM.
          git add web/wasm/Cargo.lock web/wasm/prebuilt.sha256
          if git diff --cached --quiet; then
            echo "Prebuilt WASM packages are already current."
          else
            git commit -m "build: refresh prebuilt WASM packages"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: serula-wasm-packages
          path: |
            web/wasm/pkg
            web/wasm/pkg-threads
            web/wasm/pkg-nosimd
            web/wasm/pkg-threads-nosimd
            web/wasm/prebuilt.sha256
          retention-days: 90
