name: Record live Cloudflare deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: record-live-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the deployed commit on serula.site
        shell: bash
        run: |
          for attempt in {1..60}; do
            if marker=$(curl --fail --silent --show-error --max-time 8 \
                "https://serula.site/deploy-version.txt?sha=${GITHUB_SHA}&attempt=${attempt}") &&
                [[ "$marker" == "Git commit: $GITHUB_SHA" ]]; then
              echo "Verified $GITHUB_SHA on serula.site"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloudflare did not serve the expected commit before the timeout."
          exit 1

  record:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://serula.site
    steps:
      - run: echo "Cloudflare served the verified production commit $GITHUB_SHA."
