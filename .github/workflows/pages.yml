name: Validate Serula Web
# trigger refresh 2026-09-30

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check prebuilt WASM
        id: wasm
        shell: bash
        run: |
          ready=true
          expected="$(node scripts/wasm-fingerprint.mjs)"
          actual="$(cat wasm/prebuilt.sha256 2>/dev/null || true)"
          if [ "$expected" != "$actual" ]; then
            ready=false
          fi
          for dir in wasm/pkg wasm/pkg-threads wasm/pkg-nosimd wasm/pkg-threads-nosimd; do
            if [ ! -d "$dir" ] || ! find "$dir" -maxdepth 1 -name '*.wasm' -print -quit | grep -q .; then
              ready=false
              break
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.wasm.outputs.ready != 'true'
        run: rustup toolchain install nightly-2026-08-30 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack
        if: steps.wasm.outputs.ready != 'true'
        run: npm install --global wasm-pack@0.15.0
      - name: Build WASM fallback
        if: steps.wasm.outputs.ready != 'true'
        run: |
          npm run wasm:build
          node scripts/wasm-fingerprint.mjs > wasm/prebuilt.sha256
      - name: Production build
        run: npm run build
      - name: Test
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser theme regression tests
        run: npx playwright test tests/premium-theme.spec.ts tests/critical-smoke.spec.ts --project=chromium
      - name: Upload visual review screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: serula-theme-screenshots
          path: web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Lighthouse on built application preview
        if: github.event_name == 'pull_request'
        run: |
          npm install --global @lhci/cli@0.15.x
          npm run preview -- --port 4173 > /tmp/serula-preview.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/ > /dev/null
          lhci collect --url=http://127.0.0.1:4173/ --numberOfRuns=3
          node <<'NODE'
          const fs = require('node:fs');
          const names = fs.readdirSync('.lighthouseci').filter(name => /^lhr-.*\.json$/.test(name));
          if (names.length !== 3) throw Error(`Expected three preview reports, found ${names.length}`);
          for (const [index, name] of names.sort().entries()) {
            const report = JSON.parse(fs.readFileSync(`.lighthouseci/${name}`, 'utf8'));
            if (report.audits['http-status-code']?.score !== 1 || !report.finalDisplayedUrl?.startsWith('http://127.0.0.1:4173/')) {
              throw Error(`Run ${index + 1} measured an error page or unexpected URL`);
            }
            console.log(`Preview run ${index + 1}: ${['performance','accessibility','best-practices','seo'].map(category => `${category} ${Math.round(report.categories[category].score * 100)}`).join(', ')}`);
          }
          NODE
      - name: Upload preview Lighthouse reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: serula-preview-lighthouse-reports
          path: web/.lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
