name: Validate Serula Web
# trigger refresh 2026-09-30

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Check prebuilt WASM
        id: wasm
        shell: bash
        run: |
          ready=true
          expected="$(node scripts/wasm-fingerprint.mjs)"
          actual="$(cat wasm/prebuilt.sha256 2>/dev/null || true)"
          if [ "$expected" != "$actual" ]; then
            ready=false
          fi
          for dir in wasm/pkg wasm/pkg-threads wasm/pkg-nosimd wasm/pkg-threads-nosimd; do
            if [ ! -d "$dir" ] || ! find "$dir" -maxdepth 1 -name '*.wasm' -print -quit | grep -q .; then
              ready=false
              break
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.wasm.outputs.ready != 'true'
        run: rustup toolchain install nightly-2026-08-30 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack
        if: steps.wasm.outputs.ready != 'true'
        run: npm install --global wasm-pack@0.15.0
      - name: Build WASM fallback
        if: steps.wasm.outputs.ready != 'true'
        run: npm run wasm:build
      - name: Source integrity
        run: npm run source:check
      - name: Typecheck
        run: npm run typecheck
      - name: Vite build
        run: npx vite build
      - name: Test
        run: npm test
