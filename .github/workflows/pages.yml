name: Build Serula Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serula-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-08-30 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Install wasm-pack
        run: npm install --global wasm-pack@0.15.0
      - name: Install web dependencies
        run: npm ci
      - name: Build production web app
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: serula-web-dist
          path: web/dist
          if-no-files-found: error
