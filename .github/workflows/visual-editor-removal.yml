name: Visual editor removal smoke
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  no-visual-editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual-editor-removal.spec.ts --project=chromium
