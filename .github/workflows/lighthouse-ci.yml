name: Serula Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serula-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit built Serula preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Start local production build preview
        run: |
          npm run preview -- --port 4173 > /tmp/serula-lighthouse-preview.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/ > /dev/null

      - name: Run Lighthouse against built preview
        run: lhci collect --url=http://127.0.0.1:4173/ --numberOfRuns=3

      - name: Verify and summarize all three reports
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reports = fs.readdirSync('.lighthouseci').filter(name => /^lhr-.*\.json$/.test(name));
          if (reports.length !== 3) throw Error(`Expected 3 Lighthouse reports, found ${reports.length}`);
          let invalid = false;
          for (const [index, name] of reports.sort().entries()) {
            const report = JSON.parse(fs.readFileSync(`.lighthouseci/${name}`, 'utf8'));
            const status = report.audits['http-status-code'];
            if (status?.score !== 1 || !report.finalDisplayedUrl?.startsWith('http://127.0.0.1:4173/')) {
              invalid = true;
              console.error(`Run ${index + 1} did not measure the local production build: HTTP ${status?.displayValue ?? 'unknown'}, URL ${report.finalDisplayedUrl ?? 'unknown'}.`);
              continue;
            }
            const scores = ['performance', 'accessibility', 'best-practices', 'seo']
              .map(category => `${category}: ${Math.round(report.categories[category].score * 100)}`);
            console.log(`Run ${index + 1}: ${scores.join(', ')}`);
          }
          if (invalid) process.exitCode = 1;
          NODE

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serula-preview-lighthouse-reports
          path: web/.lighthouseci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
