name: Puck dependency lock bootstrap (temporary)
on:
  push:
    branches:
      - feature/puck-studio-safe-adapter-20261102
permissions:
  contents: write
jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile for the pinned Puck dependency
        run: cd web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile into this feature branch only
        run: |
          if ! git diff --quiet -- web/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/package-lock.json
            git commit -m "build: lock Puck dependency tree"
            git push origin HEAD:feature/puck-studio-safe-adapter-20261102
          fi
