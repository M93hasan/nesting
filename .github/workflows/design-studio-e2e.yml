name: Design Studio E2E
on:
  push:
    branches:
      - feature/admin-visual-design-studio-20261102
      - feature/real-workspace-layout-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  design-e2e:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/design-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --config vitest.design.config.ts
      - run: npm run build
      - run: npx playwright test tests/design-publication.spec.ts tests/design-editor-ui.spec.ts tests/puck-design-editor.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-editor-visual-qa
          path: web/test-results/design-editor-fullscreen.png
          if-no-files-found: ignore
