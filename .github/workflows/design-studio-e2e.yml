name: Design Studio E2E
on:
  push:
    branches:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  design-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run --config vitest.design.config.ts
      - run: npm run build
      - run: npx playwright test tests/design-publication.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nesting-design-compatibility
          path: web/test-results/
          if-no-files-found: ignore
