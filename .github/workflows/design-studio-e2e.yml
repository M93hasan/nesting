name: Design Studio E2E
on:
  push:
    branches:
      - feature/admin-visual-design-studio-20261102
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  design-e2e:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/admin-visual-design-studio-20261102'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx vitest run worker/design-document.test.js src/components/design-component-registry.test.ts src/components/design-appearance-adapter.test.ts
      - run: npm run build
      - run: npx playwright test tests/design-publication.spec.ts --project=chromium
