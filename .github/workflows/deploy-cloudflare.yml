name: Deploy Serula to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serula-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify prebuilt WASM
        shell: bash
        run: |
          expected="$(node scripts/wasm-fingerprint.mjs)"
          actual="$(cat wasm/prebuilt.sha256 2>/dev/null || true)"
          test "$expected" = "$actual"
          for dir in wasm/pkg wasm/pkg-threads wasm/pkg-nosimd wasm/pkg-threads-nosimd; do
            test -d "$dir"
            find "$dir" -maxdepth 1 -name '*.wasm' -print -quit | grep -q .
          done
      - name: Source integrity
        run: npm run source:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx vite build
      - name: Test
        run: npm test
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
