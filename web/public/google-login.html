<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serula Nesting - Google ile giriş</title>
  <link rel="icon" type="image/svg+xml" href="/serula-logo.svg">
  <style>
    @font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:200 800;font-display:swap;src:url('/fonts/plus-jakarta-sans/latin-ext.woff2') format('woff2');unicode-range:U+0100-024F}
    @font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-weight:200 800;font-display:swap;src:url('/fonts/plus-jakarta-sans/latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
    :root{color-scheme:dark;--page:light-dark(#eef2fb,#060b24);--panel:light-dark(#fff,#101735);--ink:light-dark(#14234b,#f3f6ff);--muted:light-dark(#536481,#a3b1d0);--border:light-dark(#dbe3f2,#273255);--accent:light-dark(#075ed8,#7cb8ff);font:12px/1.55 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--page)}
    body,body *{font-size:12px!important;font-weight:500!important}
    :root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}:root[data-theme=system]{color-scheme:light dark}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    body{background:radial-gradient(ellipse at 20% 0%,light-dark(#c9ddff88,#142c6860),transparent 55%),var(--page)}
    .card{width:min(100%,430px);background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:32px;box-shadow:0 20px 64px #02061925;text-align:center}
    img{width:58px;height:58px}h1{font-size:25px;font-weight:750;letter-spacing:-.04em;margin:14px 0 8px}p{color:var(--muted);margin:0 0 18px}
    #google{min-height:44px;display:flex;justify-content:center;align-items:center;margin:18px 0}
    #status{min-height:22px;font-size:13px;color:var(--muted)}.error{color:light-dark(#b51f36,#ff9eaa)!important}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:16px;padding:8px 16px;border:1px solid var(--border);border-radius:11px;color:var(--accent);text-decoration:none;font-weight:600}
    a:hover{background:light-dark(#edf3ff,#1c2a50)}a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    @media(max-width:420px){.card{padding:24px 18px}}
  </style>
  <script>document.documentElement.dataset.theme='dark';try{const theme=localStorage.getItem('serula-theme');if(theme==='light'||theme==='dark'||theme==='system')document.documentElement.dataset.theme=theme;}catch{}</script>
</head>
<body>
  <main class="card">
    <img src="/serula-logo.svg" alt="Serula">
    <h1>Serula Nesting</h1>
    <p>Google hesabınızla devam edin.</p>
    <div id="google"></div>
    <div id="status">Google giriş servisi hazırlanıyor…</div>
    <a href="/">Ana sayfaya dön</a>
  </main>
<script>
const statusEl=document.getElementById('status');
const requestedLocale=new URLSearchParams(location.search).get('locale')||'tr';
const selectedLocale=['tr','en','ar','fa'].includes(requestedLocale)?requestedLocale:'tr';
document.documentElement.lang=selectedLocale==='fa'?'fa-IR':selectedLocale;
document.documentElement.dir=selectedLocale==='ar'||selectedLocale==='fa'?'rtl':'ltr';
try{localStorage.setItem('serula-locale',selectedLocale)}catch{}
function fail(message){statusEl.className='error';statusEl.textContent=message;}
async function cleanIsolation(){
  if(!('serviceWorker' in navigator))return false;
  const registrations=await navigator.serviceWorker.getRegistrations();
  const isolationRegs=registrations.filter(r=>(r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||'').includes('/isolation-worker.js'));
  if(!isolationRegs.length)return false;
  await Promise.all(isolationRegs.map(r=>r.unregister()));
  try{
    for(const key of Object.keys(sessionStorage))if(key.startsWith('serula-isolation'))sessionStorage.removeItem(key);
  }catch{}
  return !!navigator.serviceWorker.controller;
}
function loadGoogle(){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://accounts.google.com/gsi/client?hl='+encodeURIComponent(selectedLocale);
    script.async=true;
    script.defer=true;
    script.onload=resolve;
    script.onerror=()=>reject(new Error('Google giriş kütüphanesi yüklenemedi.'));
    document.head.appendChild(script);
  });
}
async function handleCredential(response){
  try{
    statusEl.className='';
    statusEl.textContent='Giriş yapılıyor…';
    const credential=String(response?.credential||'');
    if(!credential)throw new Error('Google kimlik bilgisi alınamadı.');
    const r=await fetch('/api/auth/google',{
      method:'POST',
      credentials:'same-origin',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({credential,locale:selectedLocale})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||'Google girişi başarısız.');
    location.replace('/?google=ok');
  }catch(error){fail(error instanceof Error?error.message:String(error));}
}
async function start(){
  try{
    if(await cleanIsolation()){
      location.replace('/google-login.html?clean=1');
      return;
    }
    const configResponse=await fetch('/api/auth/google-config',{credentials:'same-origin',cache:'no-store'});
    const config=await configResponse.json().catch(()=>({}));
    if(!configResponse.ok||!config.clientId)throw new Error('Google Client ID alınamadı.');
    await loadGoogle();
    if(!window.google?.accounts?.id)throw new Error('Google giriş servisi başlatılamadı.');
    google.accounts.id.initialize({
      client_id:config.clientId,
      callback:handleCredential,
      auto_select:false,
      ux_mode:'popup',
      use_fedcm_for_button:false,
      itp_support:true
    });
    google.accounts.id.renderButton(document.getElementById('google'),{
      theme:'outline',
      size:'large',
      text:'continue_with',
      shape:'pill',
      width:300,
      locale:selectedLocale
    });
    statusEl.textContent='';
  }catch(error){fail(error instanceof Error?error.message:String(error));}
}
start();
</script>
</body>
</html>
