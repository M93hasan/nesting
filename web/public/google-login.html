<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serula Nesting - Google ile giriş</title>
  <link rel="icon" type="image/svg+xml" href="/serula-logo.svg">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212f;background:#f5f6f8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    .card{width:min(100%,390px);background:#fff;border:1px solid #dde2e9;border-radius:18px;padding:30px;box-shadow:0 16px 48px #18212f18;text-align:center}
    img{width:72px;height:72px}h1{font-size:23px;margin:12px 0 8px}p{color:#596579;margin:0 0 18px}
    #google{min-height:44px;display:flex;justify-content:center;align-items:center;margin:18px 0}
    #status{min-height:22px;font-size:13px;color:#596579}.error{color:#b42318!important}
    a{display:inline-block;margin-top:10px;color:#176b58;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <img src="/serula-logo.svg" alt="Serula">
    <h1>Serula Nesting</h1>
    <p>Google hesabınızla devam edin.</p>
    <div id="google"></div>
    <div id="status">Google giriş servisi hazırlanıyor…</div>
    <a href="/">Ana sayfaya dön</a>
  </main>
<script>
const statusEl=document.getElementById('status');
function fail(message){statusEl.className='error';statusEl.textContent=message;}
async function cleanIsolation(){
  if(!('serviceWorker' in navigator))return false;
  const registrations=await navigator.serviceWorker.getRegistrations();
  const isolationRegs=registrations.filter(r=>(r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||'').includes('/isolation-worker.js'));
  if(!isolationRegs.length)return false;
  await Promise.all(isolationRegs.map(r=>r.unregister()));
  try{
    for(const key of Object.keys(sessionStorage))if(key.startsWith('serula-isolation'))sessionStorage.removeItem(key);
  }catch{}
  return !!navigator.serviceWorker.controller;
}
function loadGoogle(){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://accounts.google.com/gsi/client?hl=tr';
    script.async=true;
    script.defer=true;
    script.onload=resolve;
    script.onerror=()=>reject(new Error('Google giriş kütüphanesi yüklenemedi.'));
    document.head.appendChild(script);
  });
}
async function handleCredential(response){
  try{
    statusEl.className='';
    statusEl.textContent='Giriş yapılıyor…';
    const credential=String(response?.credential||'');
    if(!credential)throw new Error('Google kimlik bilgisi alınamadı.');
    const r=await fetch('/api/auth/google',{
      method:'POST',
      credentials:'same-origin',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({credential})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||'Google girişi başarısız.');
    location.replace('/?google=ok');
  }catch(error){fail(error instanceof Error?error.message:String(error));}
}
async function start(){
  try{
    if(await cleanIsolation()){
      location.replace('/google-login.html?clean=1');
      return;
    }
    const configResponse=await fetch('/api/auth/google-config',{credentials:'same-origin',cache:'no-store'});
    const config=await configResponse.json().catch(()=>({}));
    if(!configResponse.ok||!config.clientId)throw new Error('Google Client ID alınamadı.');
    await loadGoogle();
    if(!window.google?.accounts?.id)throw new Error('Google giriş servisi başlatılamadı.');
    google.accounts.id.initialize({
      client_id:config.clientId,
      callback:handleCredential,
      auto_select:false,
      ux_mode:'popup',
      use_fedcm_for_button:false,
      itp_support:true
    });
    google.accounts.id.renderButton(document.getElementById('google'),{
      theme:'outline',
      size:'large',
      text:'continue_with',
      shape:'pill',
      width:300,
      locale:'tr'
    });
    statusEl.textContent='';
  }catch(error){fail(error instanceof Error?error.message:String(error));}
}
start();
</script>
</body>
</html>
