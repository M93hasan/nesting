<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Serula Nesting - Google ile giriş</title>
  <link rel="icon" type="image/svg+xml" href="/serula-logo.svg">
  <script>try{const t=localStorage.getItem('serula-theme');document.documentElement.dataset.theme=t==='dark'?'dark':'light'}catch{document.documentElement.dataset.theme='light'}</script>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17191f;background:#f7f8fa;color-scheme:light}
    :root[data-theme="dark"]{color:#f3f4f6;background:#101114;color-scheme:dark}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:inherit}
    .card{width:min(100%,400px);background:light-dark(#fff,#191a20);border:1px solid light-dark(#e1e5eb,#303238);border-radius:18px;padding:34px;box-shadow:0 24px 72px #10111416;text-align:center}
    img{width:72px;height:72px}h1{font-size:24px;letter-spacing:-.7px;margin:14px 0 8px;font-weight:650}
    p{color:light-dark(#777d89,#a0a3ad);margin:0 0 18px}
    #google{min-height:44px;display:flex;justify-content:center;align-items:center;margin:20px 0}
    #status{min-height:22px;font-size:13px;color:light-dark(#777d89,#a0a3ad)}.error{color:light-dark(#c23d4b,#ff9aa5)!important}
    a{display:inline-block;margin-top:10px;color:light-dark(#5e6ad2,#9aa3ff);text-decoration:none}
    a:hover{text-decoration:underline}
    @media(max-width:480px){.card{padding:28px 22px;border-radius:16px}}
  </style>
</head>
<body>
  <main class="card">
    <img src="/serula-logo.svg" alt="Serula">
    <h1>Serula Nesting</h1>
    <p>Google hesabınızla devam edin.</p>
    <div id="google"></div>
    <div id="status">Google giriş servisi hazırlanıyor…</div>
    <a href="/">Ana sayfaya dön</a>
  </main>
<script>
const statusEl=document.getElementById('status');
const requestedLocale=new URLSearchParams(location.search).get('locale')||'tr';
const selectedLocale=['tr','en','ar','fa'].includes(requestedLocale)?requestedLocale:'tr';
document.documentElement.lang=selectedLocale==='fa'?'fa-IR':selectedLocale;
document.documentElement.dir=selectedLocale==='ar'||selectedLocale==='fa'?'rtl':'ltr';
try{localStorage.setItem('serula-locale',selectedLocale)}catch{}
function fail(message){statusEl.className='error';statusEl.textContent=message;}
async function cleanIsolation(){
  if(!('serviceWorker' in navigator))return false;
  const registrations=await navigator.serviceWorker.getRegistrations();
  const isolationRegs=registrations.filter(r=>(r.active?.scriptURL||r.installing?.scriptURL||r.waiting?.scriptURL||'').includes('/isolation-worker.js'));
  if(!isolationRegs.length)return false;
  await Promise.all(isolationRegs.map(r=>r.unregister()));
  try{
    for(const key of Object.keys(sessionStorage))if(key.startsWith('serula-isolation'))sessionStorage.removeItem(key);
  }catch{}
  return !!navigator.serviceWorker.controller;
}
function loadGoogle(){
  return new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://accounts.google.com/gsi/client?hl='+encodeURIComponent(selectedLocale);
    script.async=true;
    script.defer=true;
    script.onload=resolve;
    script.onerror=()=>reject(new Error('Google giriş kütüphanesi yüklenemedi.'));
    document.head.appendChild(script);
  });
}
async function handleCredential(response){
  try{
    statusEl.className='';
    statusEl.textContent='Giriş yapılıyor…';
    const credential=String(response?.credential||'');
    if(!credential)throw new Error('Google kimlik bilgisi alınamadı.');
    const r=await fetch('/api/auth/google',{
      method:'POST',
      credentials:'same-origin',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({credential,locale:selectedLocale})
    });
    const data=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(data.error||'Google girişi başarısız.');
    location.replace('/?google=ok');
  }catch(error){fail(error instanceof Error?error.message:String(error));}
}
async function start(){
  try{
    if(await cleanIsolation()){
      location.replace('/google-login.html?clean=1');
      return;
    }
    const configResponse=await fetch('/api/auth/google-config',{credentials:'same-origin',cache:'no-store'});
    const config=await configResponse.json().catch(()=>({}));
    if(!configResponse.ok||!config.clientId)throw new Error('Google Client ID alınamadı.');
    await loadGoogle();
    if(!window.google?.accounts?.id)throw new Error('Google giriş servisi başlatılamadı.');
    google.accounts.id.initialize({
      client_id:config.clientId,
      callback:handleCredential,
      auto_select:false,
      ux_mode:'popup',
      use_fedcm_for_button:false,
      itp_support:true
    });
    google.accounts.id.renderButton(document.getElementById('google'),{
      theme:'outline',
      size:'large',
      text:'continue_with',
      shape:'pill',
      width:300,
      locale:selectedLocale
    });
    statusEl.textContent='';
  }catch(error){fail(error instanceof Error?error.message:String(error));}
}
start();
</script>
</body>
</html>
