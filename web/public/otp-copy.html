<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
  <title>Doğrulama Kodunu Kopyala · Serula Nesting</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f1f5f9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}
    main{background:#fff;border:1px solid #cbd5e1;box-shadow:0 10px 32px #172b4d14;border-radius:16px;padding:30px 26px;width:min(440px,100%);text-align:center}
    .brand{display:flex;align-items:center;justify-content:center;gap:10px;color:#1d4ed8;font-size:14px;font-weight:800;letter-spacing:.1em}
    .mark{width:36px;height:36px;border-radius:9px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:22px}
    h1{font-size:23px;line-height:1.35;margin:24px 0 10px}
    p{font-size:14px;line-height:1.6;color:#475569;margin:0 0 22px}
    .code{font-size:clamp(29px,9vw,43px);font-weight:800;letter-spacing:.17em;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;margin-bottom:16px;padding:18px 10px;user-select:all;overflow-wrap:normal}
    button{border:0;border-radius:9px;background:#2563eb;color:#fff;font:inherit;font-size:15px;font-weight:750;min-height:46px;width:100%;padding:12px 16px;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}
    button:disabled{background:#94a3b8;cursor:default}
    .status{margin-top:12px;min-height:24px;color:#166534;font-weight:650;font-size:13px}
    .note{margin:8px 0 0;color:#64748b;font-size:12px}
    .back{display:inline-block;margin-top:22px;color:#1d4ed8;font-size:14px;text-decoration:none;font-weight:650}
  </style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">S</span>SERULA NESTING PRO</div>
  <h1>Doğrulama kodunuzu kopyalayın</h1>
  <p>Bu kod 10 dakika geçerlidir. Kopyaladıktan sonra kayıt yaptığınız sekmeye dönüp kodu yapıştırın.</p>
  <div id="otp-code" class="code" aria-label="6 haneli doğrulama kodu"></div>
  <button type="button" id="copy" disabled>Kodu kopyala</button>
  <div id="status" role="status" aria-live="polite" class="status"></div>
  <p class="note">Kodu kimseyle paylaşmayın. Bu sayfa kodu bir sunucuya göndermez.</p>
  <a class="back" href="https://serula.site/">Serula Nesting ana sayfası</a>
</main>
<script>
  (() => {
    const codeElement=document.getElementById('otp-code');
    const button=document.getElementById('copy');
    const status=document.getElementById('status');
    const code=location.hash.slice(1);
    // The one-time code must never remain in the browser history or analytics URL.
    history.replaceState(null,'',location.pathname+location.search);
    if(!/^\d{6}$/.test(code)){
      codeElement.textContent='Kod bulunamadı';
      status.textContent='Lütfen e-postanızdaki bağlantıyı yeniden açın.';
      status.style.color='#b91c1c';
      return;
    }
    codeElement.textContent=code;
    button.disabled=false;
    button.addEventListener('click',async()=>{
      try{
        await navigator.clipboard.writeText(code);
        status.textContent='Kod kopyalandı. Kayıt ekranına dönebilirsiniz.';
        button.textContent='Kopyalandı ✓';
      }catch{
        status.textContent='Otomatik kopyalanamadı. Yukarıdaki kodu basılı tutup seçerek kopyalayın.';
        status.style.color='#b45309';
        const selection=window.getSelection();
        const range=document.createRange();
        range.selectNodeContents(codeElement);
        selection?.removeAllRanges();
        selection?.addRange(range);
      }
    });
  })();
</script>
</body>
</html>
